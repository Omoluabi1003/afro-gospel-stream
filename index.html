<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico"> <!-- Create public/favicon.ico -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A captivating futuristic progressive web application.">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1a1a2e"> <!-- Matches manifest.json -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png"> <!-- Main icon for iOS -->
    <link rel="manifest" href="/manifest.json"> <!-- Correct path for Vite -->

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <title>Futuristic PWA Showcase</title> <!-- Title matches manifest name -->
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
